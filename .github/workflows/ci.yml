name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint (syntax + real-bug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff (E9,F63,F7,F82 — no style enforcement)
        run: ruff check --select E9,F63,F7,F82 scripts tools okengine-mcp okengine-reader okengine-cockpit tests

  test:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      # The MCP server tests self-skip without `mcp`. HARD-fail the install (no `|| echo`) and VERIFY
      # the import, so a broken mcp pin (a new python leg, a yanked wheel, a resolver conflict) can't
      # make the 5 mcp-gated modules — incl. the Bearer-token 401 boundary — SILENTLY skip on a green
      # build (invariant-audit #23).
      - run: pip install -r okengine-mcp/requirements.txt
      - run: pip install -e .
      - run: python -c "import mcp"
      - name: pytest
        run: python -m pytest

  scaffold:
    name: scaffold validates clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: pip install -e .
      - name: framework init -> framework validate (no FAILs)
        run: |
          python scripts/framework_init.py /tmp/pack --domain "CI Scaffold"
          python -m scripts.framework_validate /tmp/pack --quiet
      - name: generated pack's own validator
        run: cd /tmp/pack && python validate.py
      - name: docker compose config (smoke — validates compose without building)
        run: docker compose -f /tmp/pack/docker-compose.yml config -q

  # NOTE: CI runs on GitHub Actions. All checks also run locally via the matching
  # `make` targets, so they work regardless of CI platform (okengine#54-#58).

  audit:
    name: supply-chain + security scan (okengine#54)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pip-audit>=2.7,<3" "bandit>=1.7,<2"
      # reader + mcp are SEPARATE images/venvs — scan each requirements file on its own (installing
      # them together is an artificial cross-env conflict). All three gate.
      - name: pip-audit dev tools (gating)
        run: pip-audit -r requirements-dev.txt
      - name: pip-audit mcp runtime (gating)
        run: pip-audit -r okengine-mcp/requirements.txt
      - name: pip-audit reader runtime (gating)
        run: pip-audit -r okengine-reader/requirements.txt
      - name: pip-audit cockpit runtime (gating)
        run: pip-audit -r okengine-cockpit/requirements.txt
      - name: bandit (python security lint, medium+ — blocking full runtime surface)
        run: >-
          bandit -q -ll -r scripts tools okengine-mcp okengine-reader okengine-cockpit
          okengine-operations okengine-projection extensions plugins -x tests

  typecheck:
    name: limited type check (okengine#57)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r okengine-mcp/requirements.txt
      - run: pip install -e .
      - name: mypy (core tools + MCP — blocking)
        run: python -m mypy

  coverage:
    name: test coverage report (okengine#56)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r okengine-mcp/requirements.txt
      - run: pip install -e .
      - name: pytest --cov (100% line and branch gate)
        run: >-
          python -m pytest tests/ -q --import-mode=importlib --cov
          --cov-config=pyproject.toml --cov-report=term-missing
          --cov-report=json:coverage.json --cov-fail-under=100
      - run: python scripts/check_branch_coverage.py coverage.json --config pyproject.toml --line-min 100 --per-file

  docker-build:
    name: build service images (okengine#55)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build okengine-reader image
        # The reader Dockerfile assembles the engine wheel from repository-root
        # sources, so its build context must be the repository root.
        run: docker build -t okengine-reader:ci -f okengine-reader/Dockerfile .
      - name: build okengine-mcp image
        # context = repo root (the Dockerfile COPYs okengine-mcp/* AND scripts/cron/*)
        run: docker build -t okengine-mcp:ci -f okengine-mcp/Dockerfile .
