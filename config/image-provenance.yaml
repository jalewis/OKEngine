# okengine#590 — which file identifies each engine-built image, and where it lands inside it.
#
# The gateway image carries an `org.okengine.git_sha` label (build-engine-image.sh stamps it) and
# deploy.sh rebuilds on drift; its CONTENT (the carried Hermes patch series) is checked by
# scripts/hermes_patch_probe.py, post_deploy_verify step [3b2] (okengine#1044 [29]), not here. The compose-built images now carry `org.okengine.engine_image_tag`
# from the engine-generated override (okengine#1042 [14]): that says which deploy built the image,
# not what a later edit or a reused build cache put in it. So these are also verified by CONTENT:
# hash declared baked files and trees in the running container against the same source in ENGINE_DIR. One entrypoint alone can stay byte-identical
# while the implementation or policy it imports changes.
#
# The representative file must be one the image COPIES from ENGINE_DIR (not generated, not vendored),
# because the question being answered is "was this image built from this source". Chosen per service
# and confirmed present in a live container on 2026-08-15.
services:
  # okengine-mcp was MISSING here until okengine#596, and it is the one that went stale: a
  # fleet-wide rebuild had one deployment build correctly, three fail with `unable to prepare
  # context` while their `up -d` reused the existing tag anyway, and one build against a
  # six-week-old tree and re-tag the shared image to it. Three deployments served search from
  # that image and nothing said so — the drift check that exists for exactly this covered five
  # services and not this one. `tests/test_image_drift.py` now pins the manifest to the compose
  # skeleton so a service can no longer be built from ENGINE_DIR without being listed here.
  okengine-mcp:
    source: okengine-mcp/server.py
    container: /app/server.py
    also:
      # server.py alone was byte-identical across the six weeks the stale image spanned, so it
      # would have reported clean. These are what actually moved: the schema the served search
      # tier-filters on, and the libs the image shells out to.
      - source: config/base-schema.yaml
        container: /app/config/base-schema.yaml
      - source: scripts/cron/kb_search.py
        container: /app/scripts/kb_search.py
      - source: scripts/cron/schema_lib.py
        container: /app/scripts/schema_lib.py
      - source: scripts/cron/tier_lib.py
        container: /app/scripts/tier_lib.py
      # The image installs a wheel built from the whole src/okengine tree. Probe that package as
      # a unit so a stale shared library cannot hide behind an unchanged MCP entrypoint.
      - source_dir: src/okengine
        container_dir: /usr/local/lib/python3.13/site-packages/okengine
        exclude: [data/base-schema.yaml]
      - source: okengine-mcp/requirements.txt
        container: /app/requirements.txt
      # okengine#1042 [2]/[4]: the wheel's non-package runtime members (scripts/build_engine_wheel.py
      # RUNTIME_MEMBERS). `import schema_lib` resolves to this baked copy; src/okengine and the
      # entrypoint can agree while it is stale.
      - source: tools/schema_validator.py
        container: /usr/local/lib/python3.13/site-packages/tools/schema_validator.py
      - source: tools/policy_plane.py
        container: /usr/local/lib/python3.13/site-packages/tools/policy_plane.py
      - source: okengine-mcp/output_contract_enforce.py
        container: /usr/local/lib/python3.13/site-packages/output_contract_enforce.py
      - source: okengine-mcp/converge.py
        container: /usr/local/lib/python3.13/site-packages/converge.py
      - source: scripts/cron/id_lib.py
        container: /usr/local/lib/python3.13/site-packages/id_lib.py
      - source: scripts/cron/schema_lib.py
        container: /usr/local/lib/python3.13/site-packages/schema_lib.py
      - source: scripts/cron/id_index.py
        container: /usr/local/lib/python3.13/site-packages/id_index.py
      - source: scripts/cron/okf_migrate.py
        container: /usr/local/lib/python3.13/site-packages/okf_migrate.py
      - source: config/base-schema.yaml
        container: /usr/local/lib/python3.13/site-packages/okengine/data/base-schema.yaml
  # Reader and cockpit: probe EVERY file their final stage COPYs, not app.py alone (v0.15.11 audit
  # [16]). v0.15.11 changed only okengine-reader/directory_index.py among the reader's modules; an
  # app.py-only probe would have called a stale reader in sync whenever src/okengine did not also
  # move. `tests/test_image_drift.py` derives the expected coverage from each Dockerfile's COPY lines.
  okengine-cockpit:
    source: okengine-cockpit/app.py
    container: /app/app.py
    also:
