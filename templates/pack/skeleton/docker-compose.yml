# docker-compose for {{PACK}} — {{TITLE}} (engine okengine {{ENGINE_VERSION}}).
x-okengine-compose-contract:
  version: 1
  engine_release: {{ENGINE_VERSION}}
  pack: {{PACK}}

# The pack dir IS the vault (schema.yaml + CLAUDE.md + wiki/ + crons/feeds/data).
# Set ENGINE_DIR to your engine checkout, then:
#   # HERMES_UID/HERMES_GID default to your uid via deploy.sh (you own the vault). Export a
#   # fixed uid + chown the tree only for a portable/shared vault. The :-10000 below is just a
#   # bare-compose fallback when neither deploy.sh nor an exported HERMES_UID is in play.
#   bash $ENGINE_DIR/scripts/build-engine-image.sh  # builds the gateway image (hermes-agent)
#   bash $ENGINE_DIR/scripts/ensure-runtime.sh $(pwd) # seeds config + a REAL MCP token — WITHOUT this
#                                                     # the mcp container FAILS CLOSED on the shipped
#                                                     # default token and crash-loops (okengine#208)
#   ENGINE_DIR=$ENGINE_DIR docker compose up -d --build   # --build REBUILDS reader/mcp/cockpit on an
#                                                        # engine update (plain up -d only builds when ABSENT — invariant-audit #45)
#   CRON_PACK_DIR=$(pwd) bash $ENGINE_DIR/scripts/deploy-cron-scripts.sh
#   CRON_PACK_DIR=$(pwd) bash $ENGINE_DIR/scripts/deploy-cron-plus-jobs.sh
# (or just `bash $ENGINE_DIR/scripts/deploy.sh` — it runs exactly this sequence, plus verify)
# Only the reader publishes a host port (offset by {{PORT_OFFSET}} to avoid collisions with other
# packs); the gateway is on the per-pack bridge (no host port) and reaches okengine-mcp by service
# name, and okengine-mcp needs no host port for the engine itself (okengine#138).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # A copied pre-v0.13.9 .env.example contains public, non-empty placeholders;
    # Compose interpolation alone cannot distinguish them from a real secret.
    # Refuse them BEFORE the official entrypoint initializes or opens PGDATA.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$POSTGRES_PASSWORD" in
          ""|okengine-projection-local|REPLACE_BEFORE_ENABLING)
            echo "PostgreSQL refuses an unset or example projection writer credential" >&2
            exit 1
            ;;
        esac
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: okengine
      POSTGRES_USER: okengine
      POSTGRES_PASSWORD: ${OKENGINE_PROJECTION_WRITER_PASSWORD:?Set a distinct projection writer credential}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    volumes:
      - projection-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okengine -d okengine"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources: {limits: {cpus: "2.0", memory: 2048M}}

  okengine-projection:
    build:
      context: ${ENGINE_DIR:-../engine}
      dockerfile: okengine-projection/Dockerfile
    image: okengine-projection
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      WIKI_PATH: /opt/vault
      OKENGINE_PROJECTION_WRITER_DSN: postgresql://okengine:${OKENGINE_PROJECTION_WRITER_PASSWORD:?Set a distinct projection writer credential}@postgres:5432/okengine
      OKENGINE_PROJECTION_READER_PASSWORD: ${OKENGINE_PROJECTION_READER_PASSWORD:?Set a distinct projection reader credential}
      OKENGINE_PROJECTION_INTERVAL_SECONDS: ${OKENGINE_PROJECTION_INTERVAL_SECONDS:-3600}
      OKENGINE_PROJECTION_MAX_DELETE_PCT: ${OKENGINE_PROJECTION_MAX_DELETE_PCT:-2}
      OKENGINE_PROJECTION_MAX_DELETE_ABS: ${OKENGINE_PROJECTION_MAX_DELETE_ABS:-50}
      TZ: ${TZ:-UTC}
    volumes:
      - ./:/opt/vault:ro
    deploy:
      resources: {limits: {cpus: "2.0", memory: 2048M}}

  gateway:
    # gateway image = pinned Hermes + patches + engine overlay; build it ONCE
    # with scripts/build-engine-image.sh (OKEngine has no root Dockerfile).
    # deploy.sh persists this immutable release+git-sha reference in .env and an
    # engine-managed Compose override. The fallback is intentionally non-moving: a
    # bare compose run before deploy must fail to find an image, not select :latest.
    image: ${OKENGINE_GATEWAY_IMAGE:-hermes-agent:okengine-unpinned}
    container_name: {{PACK}}-gateway
    restart: unless-stopped
    # On the compose default bridge (a per-pack network), NOT host-net (okengine#138). The gateway
    # reaches okengine-mcp by SERVICE NAME (config.yaml: http://okengine-mcp:8730/mcp); outbound
    # traffic (Telegram long-poll, model API) works over the bridge; it binds no inbound host port.
    # NO `user:` here — the gateway is an s6-overlay image that must start as
    # root and remap internally via HERMES_UID/HERMES_GID (passed below). Pinning
    # `user:` to a non-10000 uid makes s6 abort on startup (okpacks-library#12).
    volumes:
      - ./.hermes-data:/opt/data
      - ./:/opt/vault
    # Pass .env into the agent runtime: model-provider keys (OPENROUTER_API_KEY,
    # DEEPSEEK_API_KEY, …) and delivery tokens are read from the environment by
    # Hermes. required:false so `docker compose config` in pack CI (no .env) and a
    # not-yet-configured checkout don't hard-fail.
    env_file:
      - path: .env
        required: false
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # Deployment timezone — sets the container clock (logs/timestamps) AND the TZ cron-plus
      # interprets schedule exprs in (hermes-cron-plus reads CRON_TZ, else TZ). Engine default UTC
      # (zero-config, public-reference); set TZ=America/New_York (your locale) in .env so a schedule
      # like `30 13 * * *` means 13:30 LOCAL, DST-aware — next_run_at is still stored in UTC.
      - TZ=${TZ:-UTC}
      # Explicit vault path: the gateway's enforced write_server resolves the
      # vault here. The engine treats a blank WIKI_PATH as /opt/vault too, but the
      # base image ships it blank, so set it outright (okengine#34).
      - WIKI_PATH=/opt/vault
      # Pack identity — the enforced write path stamps composition provenance
      # (maintained_by / discovered_by) with this on every write, so a composed
      # multi-pack vault records which pack maintains each page (okengine#90 P3).
      - OKENGINE_PACK={{PACK}}
      # Deployment identity for inference-pool attribution. Unlike OKENGINE_PACK this names the
      # installed/composed deployment, so traffic remains distinguishable across pack ownership.
      - OKENGINE_DEPLOYMENT=${OKENGINE_DEPLOYMENT:-{{PACK}}}
      # Hermes v0.17.0 bakes ENV HERMES_WRITE_SAFE_ROOT=/opt/data and DENIES every agent
      # file-tool write outside it as a "protected system/credential file" — which silently
      # blocks the agent from writing the vault at /opt/vault (okengine#140). Widen the safe
      # root to /opt so BOTH /opt/data and /opt/vault are writable; /etc, /root, host paths
      # stay blocked, and the /opt/data credential denylist runs first and is unaffected.
      # Override here, NOT the Dockerfile — every build-engine-image re-bakes =/opt/data.
      # Any custom compose that mounts its vault outside /opt/data must replicate this.
      - HERMES_WRITE_SAFE_ROOT=/opt
      # NOTE: this var only governs NATIVE Hermes cron. The OKEngine fleet runs under the
      # cron-plus scheduler, which spawns a subprocess PER due job with no global parallel cap
      # (it reads this var nowhere), so it is INERT here — do not rely on it to throttle the
      # free tier. The real levers against a 429 stampede are the free-first fallback chain and
      # STAGGERING schedules so lanes don't fire on the same minute. See docs/model-selection.md
      # § running on free models. Kept only for a deployment that swaps back to native cron.
      - HERMES_CRON_MAX_PARALLEL=${HERMES_CRON_MAX_PARALLEL:-2}
      # ── Agent Chat (OPT-IN, off by default) ──────────────────────────────────────────────
      # Turn on the okengine-reader Chat tab — it relays to this OpenAI-compatible api_server
      # (:8642). To enable: (1) uncomment the four vars below + set API_SERVER_KEY in .env;
      # (2) uncomment the reader's OKENGINE_AGENT_* env; (3) add the platform_toolsets.api_server
      # lockdown to config.yaml (read + enforced-write + web, NO shell/code). On this bridge the
      # api_server is PRIVATE: API_SERVER_HOST=0.0.0.0 binds only the gateway container's bridge
      # interface (no host port is published for the gateway), and the reader reaches it by service
      # name (gateway:8642). It is exposed ONLY if you expose the reader — then set
      # OKENGINE_READER_PASSWORD. See docs/agent-chat.md.
      # - API_SERVER_ENABLED=true
      # - API_SERVER_KEY=${API_SERVER_KEY:-}
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_MODEL_NAME=OKEngine Agent
    command: ["gateway", "run"]
    # Scheduler-independent liveness: every in-scheduler monitor dies with cron-plus. Docker runs
    # this probe outside the scheduler and marks the gateway unhealthy when the tick lock is stale,
    # cron-plus has declared its job store stalled, a corpus fence exceeds five minutes, a running
    # receipt exceeds one hour, or a child remains in uninterruptible I/O. Three one-minute retries
    # tolerate a short legitimate write/I/O interval while making a persistent wedge fail loud.
    # The stale-run probe is bounded to the CURRENT scheduler generation: PID 1's real start time.
    # A run record is written when a lane starts and rewritten when it ends; a lane KILLED
    # instead of completed — container stop, force-recreate, OOM — leaves its record saying
    # "running" forever, and nothing reconciles it at the next start. Unbounded, one interrupted
    # lane therefore fails this probe permanently: measured 2026-09-12, every gateway on one host
    # was unhealthy, five with failing streaks over 1500, against 79 orphan records on
    # ai-research whose oldest dated from 2026-08-25.
    #
    # A health signal that is always red carries no information — a real stall becomes
    # indistinguishable from the background state, which is the exact condition this probe was
    # added to detect. A record older than the scheduler's start cannot belong to a live run and
    # can only be an orphan.
    #
    # The start is computed, not read off a timestamp: btime from /proc/stat plus PID 1's starttime
    # (/proc/1/stat field 22, in clock ticks). The first version of this bound used `-newer
    # /proc/1`, on the belief that /proc/1's mtime is the process start. It is not. procfs stamps
    # an inode when the kernel CREATES the inode, and an evicted inode is recreated on its next
    # access with the current time. Measured 2026-09-13: on two of four gateways /proc/1's mtime
    # read 31.5 hours after the container started, and the bound saw 2 of 1620 and 1 of 1367 of
    # the runs that generation had written -- so a genuinely stuck run would have reported
    # HEALTHY. That is worse than the always-red probe it replaced. The computed start matched
    # Docker's StartedAt to the second on all four. `sed 's/.*) //'` drops everything through the
    # last ") " first, because field 2 (the command name) may itself contain spaces or parens.
    #
    # This is the containment half. Reconciling orphans to a terminal state at scheduler start
    # belongs to cron-plus, an external pinned dependency (okengine#747).
    healthcheck:
      test: ["CMD-SHELL", "now=$$(date +%s); tick=$$(stat -c %Y /opt/data/cron-plus/.tick.lock 2>/dev/null) || exit 1; [ $$((now-tick)) -le 180 ] || exit 1; [ ! -s /opt/data/cron-plus/.scheduler-stalled ] || exit 1; owner=/opt/vault/.okengine/corpus/lock-owner.json; [ ! -e $$owner ] || { mtime=$$(stat -c %Y $$owner) || exit 1; [ $$((now-mtime)) -le 300 ] || exit 1; }; gen=$$(( $$(awk '/^btime/{print $$2}' /proc/stat) + $$(sed 's/.*) //' /proc/1/stat | awk '{print $$20}') / $$(getconf CLK_TCK) )); ! find /opt/data/cron-plus/runs -type f -mmin +60 -newermt @$$gen -exec grep -lE '\"status\"[[:space:]]*:[[:space:]]*\"running\"' {} + 2>/dev/null | grep -q . || exit 1; for stat in /proc/[0-9]*/stat; do grep -q ') D ' $$stat 2>/dev/null && exit 1; done; exit 0"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      # NO restart_policy here. In non-swarm Compose its `condition:` OVERRIDES the
      # top-level `restart: unless-stopped` and silently forces on-failure, which does
      # not recover a clean stop -- the June 2026 13-hour outage. Every live deployment
      # had this block removed after that incident; the skeleton kept it, so every pack
      # created since re-introduced the bug. Keep resources.limits (crash-loop bound).
      resources: {limits: {cpus: "2.0", memory: 6144M}}
  okengine-reader:
    build:
      context: ${ENGINE_DIR:-../engine}
      dockerfile: okengine-reader/Dockerfile
    image: okengine-reader
    container_name: {{PACK}}-reader
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    restart: unless-stopped
    # Local-first: host port binds loopback by default. To expose on the LAN,
    # set OKENGINE_BIND=0.0.0.0 in .env (and set OKENGINE_READER_PASSWORD).
    ports: ["${OKENGINE_BIND:-127.0.0.1}:{{READER_PORT}}:9200"]
    environment:
      - OKENGINE_READER_PASSWORD=${OKENGINE_READER_PASSWORD:-}
      # Trust enforcement (okengine#90 P4a): a PRIVATE vault REFUSES to serve unauthenticated when
      # exposed (OKENGINE_BIND != loopback) with no password. OKENGINE_TRUST is the pack's trust —
      # ensure-runtime.sh derives it from pack.yaml; default `private` is fail-safe.
      - OKENGINE_TRUST=${OKENGINE_TRUST:-private}
      - OKENGINE_BIND=${OKENGINE_BIND:-127.0.0.1}
      - OKENGINE_PROJECT_URL=${OKENGINE_PROJECT_URL:-}   # About-panel repo link (optional)
      - OKENGINE_UI_DISPLAY_NAME=${OKENGINE_UI_DISPLAY_NAME:-} # optional deployment identity in header/title
      - TZ=${TZ:-UTC}                                    # match the gateway clock (page timestamps)
      # Agent Chat (opt-in — see the gateway api_server block + docs/agent-chat.md). Both required;
      # the gateway is reached by SERVICE NAME on the bridge (private + stable, no host.docker.internal):
      # - OKENGINE_AGENT_API=http://gateway:8642/v1
      # - OKENGINE_AGENT_KEY=${API_SERVER_KEY:-}
      # - OKENGINE_AGENT_MODEL=OKEngine Agent
    volumes: ["./:/vault:ro"]
    # TCP-connect probe via python3 (present in the python:3.13-slim reader/mcp images).
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('127.0.0.1',9200)))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      # NO restart_policy here. In non-swarm Compose its `condition:` OVERRIDES the
      # top-level `restart: unless-stopped` and silently forces on-failure, which does
      # not recover a clean stop -- the June 2026 13-hour outage. Every live deployment
      # had this block removed after that incident; the skeleton kept it, so every pack
      # created since re-introduced the bug. Keep resources.limits (crash-loop bound).
      resources: {limits: {cpus: "4.0", memory: 3584M}}
  okengine-mcp:
    build:
      context: ${ENGINE_DIR:-../engine}
      dockerfile: okengine-mcp/Dockerfile
    image: okengine-mcp
    container_name: {{PACK}}-mcp
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    restart: unless-stopped
    # On the bridge the gateway reaches this by service name (okengine-mcp:8730) — NO host port is
    # needed for the engine itself (okengine#138). Publish one ONLY to expose the read query
    # surface to EXTERNAL agents/tools; then set OKENGINE_BIND=0.0.0.0 + a real OKENGINE_MCP_TOKEN.
    # ports: ["${OKENGINE_BIND:-127.0.0.1}:{{MCP_PORT}}:8730"]
    environment:
      - WIKI_PATH=/opt/vault
      - OKENGINE_MCP_TRANSPORT=streamable-http
      - PORT=8730
      - TZ=${TZ:-UTC}
      # Default token ships configured so a fresh deploy authenticates out of the
      # box; safe because the host port is loopback-only above. CHANGE before exposing.
      - OKENGINE_MCP_TOKEN=${OKENGINE_MCP_TOKEN:-okengine-local}
      # Index-maintainer tuning (docs/kb-tooling.md): mtime-poll cadence and the
      # debounce floor for change-triggered reindexing. Defaults mirror server.py's
      # (an EMPTY value would disable, not default — keep the fallbacks).
      - OKENGINE_MCP_INDEX_POLL_SECONDS=${OKENGINE_MCP_INDEX_POLL_SECONDS:-30}
      - OKENGINE_MCP_INDEX_MIN_UPDATE_SECONDS=${OKENGINE_MCP_INDEX_MIN_UPDATE_SECONDS:-60}
      # Full-reindex cadence (hours; server.py reads it, docs/kb-tooling.md documents it, 0 disables).
      # Must be listed here or the documented `OKENGINE_MCP_INDEX_REFRESH_HOURS=0` .env override never
      # reaches the container (explicit environment: list, no env_file on this service) — invariant-audit #35.
      - OKENGINE_MCP_INDEX_REFRESH_HOURS=${OKENGINE_MCP_INDEX_REFRESH_HOURS:-6}
      # Shared qmd admission control: interactive search and background updates consume the same
      # bounded pool. Queue/execute budgets prevent a model lane from pinning this container.
      - OKENGINE_MCP_QMD_CONCURRENCY=${OKENGINE_MCP_QMD_CONCURRENCY:-2}
      - OKENGINE_MCP_SEARCH_QUEUE_SECONDS=${OKENGINE_MCP_SEARCH_QUEUE_SECONDS:-10}
      - OKENGINE_MCP_SEARCH_TIMEOUT_SECONDS=${OKENGINE_MCP_SEARCH_TIMEOUT_SECONDS:-120}
      # Optional typed PostgreSQL projection. Start the `projection` Compose profile to make this
      # endpoint available; otherwise tools fail explicitly as unconfigured.
      - OKENGINE_PROJECTION_READER_DSN=${OKENGINE_PROJECTION_READER_DSN:-postgresql://okengine_reader:okengine-reader-local@postgres:5432/okengine}
      - OKENGINE_PROJECTION_MAX_AGE_HOURS=${OKENGINE_PROJECTION_MAX_AGE_HOURS:-6}
    volumes:
      - ./:/opt/vault:ro
      - ./.hermes-data/qmd:/opt/data/qmd
    # TCP-connect probe via python3 (present in the python:3.13-slim reader/mcp images).
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('127.0.0.1',8730)))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      # NO restart_policy here. In non-swarm Compose its `condition:` OVERRIDES the
      # top-level `restart: unless-stopped` and silently forces on-failure, which does
      # not recover a clean stop -- the June 2026 13-hour outage. Every live deployment
      # had this block removed after that incident; the skeleton kept it, so every pack
      # created since re-introduced the bug. Keep resources.limits (crash-loop bound).
      resources: {limits: {cpus: "2.0", memory: 2560M}}
  okengine-review-write:
    profiles: ["review"]
    build:
      context: ${ENGINE_DIR:-../engine}
      dockerfile: okengine-mcp/Dockerfile.review
    image: okengine-review-write
    container_name: {{PACK}}-review-write
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    restart: unless-stopped
    # Deliberately bridge-only: no host port and only narrowly scoped review
    # endpoints. Enable with `docker compose --profile review up -d --build` after
    # setting OKENGINE_REVIEW_TOKEN, reviewer identity, and either Cockpit Basic auth or the
    # explicit trusted-network mode.
    environment:
      - WIKI_PATH=/opt/vault
      - OKENGINE_WRITE_TRANSPORT=http
      - OKENGINE_WRITE_REVIEW_ONLY=1
      - OKENGINE_WRITE_HOST=0.0.0.0
      - OKENGINE_WRITE_PORT=8731
      - OKENGINE_WRITE_TOKEN=${OKENGINE_REVIEW_TOKEN:-}
      - TZ=${TZ:-UTC}
    volumes: ["./:/opt/vault"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8731/healthz', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      # NO restart_policy here. In non-swarm Compose its `condition:` OVERRIDES the
      # top-level `restart: unless-stopped` and silently forces on-failure, which does
      # not recover a clean stop -- the June 2026 13-hour outage. Every live deployment
      # had this block removed after that incident; the skeleton kept it, so every pack
      # created since re-introduced the bug. Keep resources.limits (crash-loop bound).
      resources: {limits: {cpus: "0.5", memory: 256M}}
  okengine-operation-runner:
    profiles: ["review"]
    build:
      context: ${ENGINE_DIR:-../engine}
      dockerfile: okengine-operations/Dockerfile
    image: okengine-operation-runner
    container_name: {{PACK}}-operation-runner
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    restart: unless-stopped
    # Bridge-only governed execution. The allowlist is required; an empty value
    # exposes no operations. Cockpit plans before it can start a mutation.
    environment:
      - WIKI_PATH=/opt/vault
      - OKENGINE_OPERATION_TOKEN=${OKENGINE_REVIEW_TOKEN:-}
      - OKENGINE_OPERATION_ALLOW=${OKENGINE_OPERATION_ALLOW:-}
      - TZ=${TZ:-UTC}
    volumes: ["./:/opt/vault"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8732/healthz', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      # NO restart_policy here. In non-swarm Compose its `condition:` OVERRIDES the
      # top-level `restart: unless-stopped` and silently forces on-failure, which does
      # not recover a clean stop -- the June 2026 13-hour outage. Every live deployment
      # had this block removed after that incident; the skeleton kept it, so every pack
      # created since re-introduced the bug. Keep resources.limits (crash-loop bound).
      resources: {limits: {cpus: "4.0", memory: 3584M}}
  okengine-cockpit:
    build:
      context: ${ENGINE_DIR:-../engine}
      dockerfile: okengine-cockpit/Dockerfile
    image: okengine-cockpit
    container_name: {{PACK}}-cockpit
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    restart: unless-stopped
    # The function-oriented cockpit UI (briefings/predictions/dashboards/competitors + Browse + Chat).
    # A superset of okengine-reader — ship one or both. Local-first: host port binds loopback by
    # default. To expose on the LAN, set OKENGINE_BIND=0.0.0.0 in .env (and set OKENGINE_READER_PASSWORD
    # — the cockpit enforces the SAME auth/trust fail-safe as the reader, so a private vault refuses to
    # start exposed without one).
    ports: ["${OKENGINE_BIND:-127.0.0.1}:{{COCKPIT_PORT}}:9200"]
    environment:
      - VAULT_DIR=/vault
      # Auth/trust: SHARED credential with the reader — one password protects both UIs. The cockpit is
      # a superset of the reader (adds the agent-Chat relay), so it must not be laxer. OKENGINE_TRUST +
      # OKENGINE_BIND drive the private-vault fail-safe (okengine#90 P4a); ensure-runtime.sh derives
      # OKENGINE_TRUST from pack.yaml, default `private`.
      - OKENGINE_READER_PASSWORD=${OKENGINE_READER_PASSWORD:-}
      - OKENGINE_TRUST=${OKENGINE_TRUST:-private}
      - OKENGINE_BIND=${OKENGINE_BIND:-127.0.0.1}
      - TZ=${TZ:-UTC}
      # Human review decisions are opt-in and fail closed. The Cockpit remains
      # read-only unless all three values below AND OKENGINE_READER_PASSWORD are set.
      # Start the bridge-only writer with `docker compose --profile review up -d`.
      - OKENGINE_REVIEW_API=${OKENGINE_REVIEW_API:-}
      - OKENGINE_REVIEW_TOKEN=${OKENGINE_REVIEW_TOKEN:-}
      - OKENGINE_REVIEWER_NAME=${OKENGINE_REVIEWER_NAME:-}
      - OKENGINE_REVIEW_TRUSTED_NETWORK=${OKENGINE_REVIEW_TRUSTED_NETWORK:-0}
      - OKENGINE_OPERATION_API=http://okengine-operation-runner:8732
      - OKENGINE_OPERATION_TOKEN=${OKENGINE_REVIEW_TOKEN:-}
      # Agent Chat (OPT-IN) — relays to the gateway api_server (:8642) by SERVICE NAME on the
      # per-pack bridge; the Chat tab appears only when these are set. Requires the gateway
      # api_server on (API_SERVER_ENABLED=true + key in .env, api_server toolset lockdown in
      # config.yaml). See docs/agent-chat.md.
      # - OKENGINE_AGENT_API=http://gateway:8642/v1
      # - OKENGINE_AGENT_KEY=${API_SERVER_KEY:-}
      # - OKENGINE_AGENT_MODEL=OKEngine Agent
    volumes: ["./:/vault:ro"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('127.0.0.1',9200)))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      # NO restart_policy here. In non-swarm Compose its `condition:` OVERRIDES the
      # top-level `restart: unless-stopped` and silently forces on-failure, which does
      # not recover a clean stop -- the June 2026 13-hour outage. Every live deployment
      # had this block removed after that incident; the skeleton kept it, so every pack
      # created since re-introduced the bug. Keep resources.limits (crash-loop bound).
      resources: {limits: {cpus: "2.0", memory: 2048M}}

volumes:
  projection-data:
    # Disposable derived state. Do not include this volume in vault backups; recovery rebuilds it
    # from canonical Markdown and weekly verification proves that path.
